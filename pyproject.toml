[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multitool"
version = "0.3.0"
description = "AI-powered multitool library for CLI tool integration"
readme = "README.md"
readme-content-type = "text/markdown"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["ai", "cli", "llm", "anthropic", "openai", "developer-tools", "plugin", "library", "integration", "rag", "code-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "anthropic>=0.18.0",
    "litellm>=1.0.0",
    "openai>=1.0.0",
    "cohere>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.0",
    "pyyaml>=6.0.0",
    "watchdog>=3.0.0",
    "gitpython>=3.1.0",
    "tree-sitter>=0.20.0",
    "pygments>=2.16.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "loguru>=0.7.0",
    "pyperclip>=1.8.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",
    "qdrant-client>=1.6.0",
    "pinecone-client>=2.2.0",
    "nltk>=3.8.0",
    "langdetect>=1.0.9",
    "langchain>=0.1.0",
    "langchain-text-splitters>=0.0.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
ai-multitool = "ai_multitool.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_multitool*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
